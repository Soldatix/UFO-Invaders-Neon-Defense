name: Upgrade UFO Invaders Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-ufo-info.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use robust Info marker slicing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('.github/scripts/upgrade-ufo-info.py')
          s = p.read_text(encoding='utf-8')
          old = "pattern = re.compile(r'    <!-- Info / Donations Modal -->.*?    <!-- Read Me Modal -->', re.S)\ns, n = pattern.subn(modal, s, count=1)\nif n != 1:\n    raise SystemExit(f'Info modal replacement count: {n}')"
          new = "start_marker = '<!-- Info / Donations Modal -->'\nend_marker = '<!-- Read Me Modal -->'\nstart = s.find(start_marker)\nend = s.find(end_marker, start + len(start_marker))\nif start < 0 or end < 0:\n    raise SystemExit(f'Info markers not found: start={start}, end={end}')\ns = s[:start] + modal + s[end + len(end_marker):]"
          if old not in s:
              raise SystemExit('Expected matcher block not found in patch script')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Matcher converted to string slicing')
          PY
      - name: Patch Info
        run: python .github/scripts/upgrade-ufo-info.py
      - name: Verify content
        run: |
          grep -q 'id="ufo-standard-info"' index.html
          grep -q 'Donate with PayPal' index.html
          grep -q 'Doniraj putem PayPala' index.html
          grep -q 'copyInfoWallet' index.html
          grep -q 'Kopirano!' index.html
          test "$(grep -o 'class="ufo-copy-btn"' index.html | wc -l)" -eq 8
          ! grep -q 'apps-games-info-standard.js' index.html
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', s, re.S|re.I):
              if 'application/ld+json' not in attrs.lower():
                  scripts.append(body)
          Path('/tmp/ufo-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/ufo-inline.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade UFO Invaders Info design"
          git push
